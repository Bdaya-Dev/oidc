name: Publish packages
on:
  # Enable to also publish, when pushing a tag
  #push:
  #  tags:
  #    - '*'
  workflow_dispatch:

jobs:
  publish-packages:
    name: Publish packages
    permissions:
      contents: write
      id-token: write # Required for authentication using OIDC
    runs-on: [ ubuntu-latest ]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Keep in sync with release-prepare.yml's pin. See that file's
          # comment for why this branch's release workflows must not use
          # the latest stable Flutter/Dart. #450
          flutter-version: 3.35.4
      # see https://github.com/invertase/melos/issues/796
      - uses: bluefireteam/melos-action@main
        continue-on-error: true
        with:
          run-bootstrap: true          
          bootstrap-no-example: false      
      - uses: bluefireteam/melos-action@main
        with:
          run-bootstrap: true
          bootstrap-no-example: true
      - uses: bluefireteam/melos-action@main
        with:
          run-bootstrap: false
          publish: true