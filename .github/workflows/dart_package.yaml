#Source: https://github.com/VeryGoodOpenSource/very_good_workflows/blob/v1/.github/workflows/dart_package.yml
name: Oidc Dart Package Workflow

on:
  workflow_call:
    inputs:
      flutter_channel:
        required: false
        type: string
        default: "stable"
      flutter_version:
        required: false
        type: string
        default: "3.22.0"
      analyze_directories:
        required: false
        type: string
        default: "lib test"
      concurrency:
        required: false
        type: number
        default: 4
      coverage_excludes:
        required: false
        type: string
        default: ""
      dart_sdk:
        required: false
        type: string
        default: "stable"
      min_coverage:
        required: false
        type: number
        default: 100
      platform:
        required: false
        type: string
        default: "vm"
      check_ignore:
        required: false
        type: boolean
        default: false
      report_on:
        required: false
        type: string
        default: "lib"
      runs_on:
        required: false
        type: string
        default: "ubuntu-latest"
      setup:
        required: false
        type: string
        default: ""
      working_directory:
        required: false
        type: string
        default: "."
      custom_tests:
        required: false
        type: string
        default: ""

jobs:
  build:
    defaults:
      run:
        working-directory: ${{inputs.working_directory}}

    runs-on: ${{inputs.runs_on}}

    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@v7

      # Resolve cache coordinates without installing (see flutter_base's
      # "Resolve Flutter SDK version + cache coordinates" step for the full
      # rationale): flutter-action's OWN `cache: true` step is a long-
      # standing, still-open upstream bug on macOS/Windows runners
      # (subosito/flutter-action#350) where its POST (save) phase cannot
      # re-resolve its own `path` input and silently never persists the
      # SDK. This reusable workflow isn't currently invoked by anything in
      # this repo, but `runs_on` is caller-supplied, so it isn't
      # Linux-only by construction either -- fixed here for consistency
      # with flutter_base and the other callers of flutter-action below.
      - name: 🐦 Resolve Flutter SDK version + cache coordinates
        id: flutter_sdk_info
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{inputs.flutter_version}}
          channel: ${{inputs.flutter_channel}}
          cache: false
          pub-cache: "false"
          dry-run: true

      # `steps.flutter_sdk_info.outputs.*` cannot be referenced directly in
      # the cache step's `with:` below: its POST (save) phase fails to
      # re-resolve a `steps.*.outputs.*`-based expression on macOS/Windows
      # runners (confirmed live on this repo, run 37532075225 -- see
      # flutter_base's identical step for the full story). Copying the two
      # values into env vars first sidesteps it: `env.*` is a flat
      # key/value context that replays correctly in POST on every OS.
      - name: 🐦 Export Flutter SDK cache coordinates
        shell: bash
        run: |
          set -eu
          echo "FLUTTER_SDK_CACHE_PATH=${{ steps.flutter_sdk_info.outputs.CACHE-PATH }}" >> "$GITHUB_ENV"
          echo "FLUTTER_SDK_CACHE_KEY=${{ steps.flutter_sdk_info.outputs.CACHE-KEY }}" >> "$GITHUB_ENV"

      - name: 🐦 Restore Flutter SDK cache
        id: flutter_sdk_cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.FLUTTER_SDK_CACHE_PATH }}
          key: ${{ env.FLUTTER_SDK_CACHE_KEY }}

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{inputs.flutter_version}}
          channel: ${{inputs.flutter_channel}}
          cache: false
          pub-cache: "false"

      # Save only on pushes to main -- see flutter_base's identical step
      # for the full rationale (PR/dispatch runs restore but never write
      # their own branch-scoped copy of this multi-GB entry).
      - name: 🐦 Save Flutter SDK cache
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.flutter_sdk_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ env.FLUTTER_SDK_CACHE_PATH }}
          key: ${{ env.FLUTTER_SDK_CACHE_KEY }}

      - uses: bluefireteam/melos-action@v3

      - name: ⚙️ Run Setup
        if: "${{inputs.setup != ''}}"
        run: ${{inputs.setup}}

      - name: ✨ Check Formatting
        run: dart format --set-exit-if-changed .

      - name: 🕵️ Analyze
        continue-on-error: true
        run: dart analyze --fatal-warnings ${{inputs.analyze_directories}}

      - name: 🧪 Run Tests
        run: |
          dart pub global activate coverage 1.2.0
          dart test -j ${{inputs.concurrency}} --coverage=coverage --platform=${{inputs.platform}} && dart pub global run coverage:format_coverage --lcov ${{(inputs.check_ignore && '--check-ignore') || ''}} --in=coverage --out=coverage/lcov.info --packages=.dart_tool/package_config.json --report-on=${{inputs.report_on}}
      
      - name: 🧪 Run Custom Tests        
        if: "${{inputs.custom_tests != ''}}"
        run: ${{inputs.custom_tests}}

      - name: Report to Codecov
        uses: codecov/codecov-action@v7
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: ${{inputs.working_directory}}/coverage/lcov.info
          fail_ci_if_error: false
      # - name: 📊 Check Code Coverage
      #   uses: VeryGoodOpenSource/very_good_coverage@v2
      #   with:
      #       path: ${{inputs.working_directory}}/coverage/lcov.info
      #       exclude: ${{inputs.coverage_excludes}}
      #       min_coverage: ${{inputs.min_coverage}}
    