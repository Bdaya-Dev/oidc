#Source: https://github.com/VeryGoodOpenSource/very_good_workflows/blob/v1/.github/workflows/pana.yml
name: Oidc Pana Workflow

on:
  workflow_call:
    inputs:
      min_score:
        required: false
        type: number
        default: 120
      pana_version:
        required: false
        type: string
      runs_on:
        required: false
        type: string
        default: "ubuntu-latest"
      working_directory:
        required: false
        type: string
        default: "."

jobs:
  build:
    defaults:
      run:
        working-directory: ${{inputs.working_directory}}

    runs-on: ${{inputs.runs_on}}

    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@v7

      # Resolve cache coordinates without installing -- see
      # .github/actions/flutter_base's comment: flutter-action's OWN
      # `cache: true` step is a long-standing, still-open upstream bug on
      # macOS/Windows runners (subosito/flutter-action#350) where its POST
      # (save) phase cannot re-resolve its own `path` input and silently
      # never persists the SDK; `pub-cache: "false"` independently avoids
      # its internal pub-cache step's unscoped `hashFiles('**/pubspec.lock')`
      # (observed failing -- "couldn't finish within 120 seconds" -- on a
      # macOS runner elsewhere in this repo's CI).
      - name: 🐦 Resolve Flutter SDK version + cache coordinates
        id: flutter_sdk_info
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false
          pub-cache: "false"
          dry-run: true

      # `steps.flutter_sdk_info.outputs.*` cannot be referenced directly in
      # the cache step's `with:` below: its POST (save) phase fails to
      # re-resolve a `steps.*.outputs.*`-based expression on macOS/Windows
      # runners (confirmed live on this repo, run 37532075225 -- see
      # flutter_base's identical step for the full story). Copying the two
      # values into env vars first sidesteps it: `env.*` is a flat
      # key/value context that replays correctly in POST on every OS.
      - name: 🐦 Export Flutter SDK cache coordinates
        shell: bash
        run: |
          set -eu
          echo "FLUTTER_SDK_CACHE_PATH=${{ steps.flutter_sdk_info.outputs.CACHE-PATH }}" >> "$GITHUB_ENV"
          echo "FLUTTER_SDK_CACHE_KEY=${{ steps.flutter_sdk_info.outputs.CACHE-KEY }}" >> "$GITHUB_ENV"

      - name: 🐦 Restore Flutter SDK cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.FLUTTER_SDK_CACHE_PATH }}
          key: ${{ env.FLUTTER_SDK_CACHE_KEY }}

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false
          pub-cache: "false"

      # Save only on pushes to main -- see flutter_base's identical step
      # for the full rationale (PR/dispatch runs restore but never write
      # their own branch-scoped copy of this multi-GB entry).
      - name: 🐦 Save Flutter SDK cache
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ env.FLUTTER_SDK_CACHE_PATH }}
          key: ${{ env.FLUTTER_SDK_CACHE_KEY }}
      # see https://github.com/invertase/melos/issues/796
      - uses: bluefireteam/melos-action@main
        continue-on-error: true
        with:
          run-bootstrap: true          
          bootstrap-no-example: false      
      - uses: bluefireteam/melos-action@main
        with:
          run-bootstrap: true
          bootstrap-no-example: true
      - name: 📦 Install Pana
        run: flutter pub global activate pana ${{inputs.pana_version}}

      - name: 📊 Verify Pana Score
        run: |
          PANA=$(pana . --no-warning); PANA_SCORE=$(echo $PANA | sed -n "s/.*Points: \([0-9]*\)\/\([0-9]*\)./\1\/\2/p")
          echo "Score: $PANA_SCORE"
          IFS='/'; read -a SCORE_ARR <<< "$PANA_SCORE"; SCORE=SCORE_ARR[0];
          if (( $SCORE < ${{inputs.min_score}} )); then echo "The minimum score of ${{inputs.min_score}} was not met!"; exit 1; fi