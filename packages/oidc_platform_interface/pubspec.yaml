name: oidc_platform_interface
description: A common platform interface for the oidc plugin.
version: 1.0.4
repository: https://github.com/Bdaya-Dev/oidc/tree/main/packages/oidc_platform_interface
homepage: https://bdaya-dev.github.io/oidc/
topics: ["oidc", "openidconnect", "oauth", "authentication"]
resolution: workspace
environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.16.0
  oidc_core: ^4.0.0
  plugin_platform_interface: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Pigeon generates the native browser transport. It needs analyzer >=10, which
  # the v1 toolchain bump (copy_with_extension_gen 15 / json_serializable 6.14)
  # now allows in the workspace, so it can be a normal dev-dependency (no global
  # tool). Regenerate with `melos run generate:native`.
  #
  # ^29.0.6 (not ^26): the `flutter_test` SDK package on the beta channel pins
  # `test_api` to a version that only resolves with `test >=1.31.2`, which in
  # turn needs `analyzer >=13.0.0 <15.0.0`. Pigeon 26.3.4 constrained analyzer
  # to `>=10.0.0 <13.0.0`, a disjoint window, so beta's workspace
  # `flutter pub get` failed to solve. Pigeon 27.3.1 moved the whole window to
  # `>=13.0.0 <15.0.0` (29.x keeps the same range), which overlaps `test`'s
  # requirement on both stable and beta.
  pigeon: ^29.0.6
  very_good_analysis: ^10.0.0
