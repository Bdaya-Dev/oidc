name: oidc_core
description: A dart package containing models and helpers for OpenId Connect spec.
version: 4.0.0
repository: https://github.com/Bdaya-Dev/oidc/tree/main/packages/oidc_core
topics: ["oidc", "openidconnect", "oauth", "authentication"]
homepage: https://bdaya-dev.github.io/oidc/
resolution: workspace
environment:
  sdk: ^3.9.0

dependencies:
  crypto: ^3.0.3
  jose_plus: ^1.0.1
  http: ^1.1.0
  json_annotation: ^4.12.0
  uuid: "^4.0.0"
  meta: ^1.16.0
  nonce: ^1.2.0
  logging: ^1.2.0
  clock: ^1.1.1
  copy_with_extension: ^15.0.1
  async: ^2.13.0

dev_dependencies:
  build_runner: ^2.4.6
  test: ^1.21.0
  very_good_analysis: ^10.0.0
  json_serializable: ^6.7.1
  collection: ^1.18.0
  fake_async: ^1.3.1
  oidc_loopback_listener: ^1.1.1
  copy_with_extension_gen: ^15.0.1
  # Forces a real full GC in the #453 retention tests (see _aliveAfterGc).
  vm_service: ^15.0.0

# Test-only mTLS PKI generated by test/fixtures/mtls/generate.sh for the local
# mutual-TLS test server; never loaded by lib/. pub's secret scan flags the
# private keys, so declare them as false positives.
false_secrets:
  - /test/fixtures/mtls/*.key
