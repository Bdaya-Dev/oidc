plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

android {
    namespace 'com.bdayadev.oidc.example'
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion
                compileOptions {
                    sourceCompatibility JavaVersion.VERSION_17
                    targetCompatibility JavaVersion.VERSION_17
                }
                kotlinOptions {
                        jvmTarget = JavaVersion.VERSION_17.toString()
                }

    defaultConfig {
        applicationId "com.bdayadev.oidc.example"
        // minSdk 23 to support flutter_secure_storage
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion flutter.targetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        // PatrolJUnitRunner, not the stock AndroidJUnitRunner: MainActivityTest
        // casts InstrumentationRegistry.getInstrumentation() to it, and the stock
        // runner would throw ClassCastException.
        testInstrumentationRunner "pl.leancode.patrol.PatrolJUnitRunner"
        testInstrumentationRunnerArguments clearPackageData: "true"
        // Scheme of this app's redirect_uri (see getPlatformRedirectUri() in
        // integration_test/helpers.dart). Wires up the plugin's redirect
        // receiver, which is the capture path on every browser that lacks Auth
        // Tab support — i.e. anything but Chrome 137+.
        manifestPlaceholders += ['oidcRedirectScheme': 'com.bdayadev.oidc.example']
    }

    // PatrolJUnitRunner reads the orchestrator's "listTestsForOrchestrator"
    // argument to detect the discovery pass. Without ANDROIDX_TEST_ORCHESTRATOR
    // that argument is never set and the two-phase discovery protocol -- the
    // thing that turns Dart test names into JUnit parameters -- never engages.
    testOptions {
        execution "ANDROIDX_TEST_ORCHESTRATOR"
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig signingConfigs.debug
        }
    }
}

dependencies {
    // 1.5.1+, never 1.5.0: patrol warns that 1.5.0 cannot handle whitespace in
    // test names, and this suite's names contain spaces ("OIDC Conformance Test").
    androidTestUtil "androidx.test:orchestrator:1.5.1"
}

flutter {
    source '../..'
}
