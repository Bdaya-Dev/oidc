group 'com.bdayadev.oidc'
version '1.0-SNAPSHOT'

buildscript {
    ext.kotlin_version = '2.2.10'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.12.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}
rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

allprojects {
    gradle.projectsEvaluated {
        tasks.withType(JavaCompile) {
            options.compilerArgs << "-Xlint:unchecked" << "-Xlint:deprecation"
        }
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    // Conditional for compatibility with AGP <4.2.
    if (project.android.hasProperty("namespace")) {
        namespace 'com.bdayadev.oidc'
    }
    
    compileSdk flutter.compileSdkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.toString()
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
        test.java.srcDirs += 'src/test/kotlin'
    }


    defaultConfig {
        // androidx.browser:browser:1.10.0 declares minSdk 23; claiming 21 here
        // is a manifest-merge failure waiting to happen in any consuming app
        // that takes us at our word. 23 is the honest floor.
        minSdkVersion 23
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // Deliberately NO default for oidcRedirectScheme. A placeholder value
        // declared here is substituted into THIS library's manifest before the
        // app merge, which SHADOWS the consuming app's own value — verified by
        // building the example: with a default of 'com.bdayadev.oidc.unset' the
        // merged app manifest registered `android:scheme="com.bdayadev.oidc.unset"`
        // instead of the app's scheme, so the redirect resolved to nothing and
        // issue #418 persisted despite a correctly-configured app.
        //
        // Leaving it unset keeps `${oidcRedirectScheme}` unresolved until the
        // app merge, where the app's placeholder wins (the same contract
        // AppAuth-Android uses for appAuthRedirectScheme). An app that forgets
        // it fails the manifest merge with a build error naming the placeholder
        // — far better than a silent blank browser tab at runtime.
        //
        // Building THIS module standalone for its own unit tests has no app to
        // supply the value, so the merge would fail. The -PoidcNativeTests flag
        // supplies a dummy one for that case only; it is never set when an app
        // builds the plugin, so it cannot shadow a consumer's scheme.
        //   ./gradlew :oidc_android:testDebugUnitTest -PoidcNativeTests
        if (project.hasProperty('oidcNativeTests')) {
            manifestPlaceholders = [oidcRedirectScheme: 'com.bdayadev.oidc.test']
        }
    }

    dependencies {
        // Chrome Custom Tabs for the system-browser authorization flow
        // (replaces the AppAuth-Android dependency). Pure Kotlin/AAR, so it
        // ships no .so and is inherently 16 KB page-size compliant.
        implementation 'androidx.browser:browser:1.10.0'
        testImplementation 'org.jetbrains.kotlin:kotlin-test'
        testImplementation 'org.mockito:mockito-core:5.0.0'
        // Robolectric runs the plugin against real android.net.Uri / Activity
        // implementations on the JVM. Without it OidcPlugin.kt is unreachable
        // from any test (the Dart tests mock the Pigeon channel, so they stub
        // out native redirect capture entirely) — which is how #418 shipped.
        testImplementation 'org.robolectric:robolectric:4.15.1'
        testImplementation 'androidx.test:core:1.7.0'
    }

    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.returnDefaultValues = true
        unitTests.all {
            testLogging {
                events "passed", "skipped", "failed", "standardOut", "standardError"
                outputs.upToDateWhen {false}
                showStandardStreams = true
            }
        }
    }
}